
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="wallet" x1="220" y1="180" x2="570" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF879D"/>
      <stop offset=".45" stop-color="#FF347D"/>
      <stop offset="1" stop-color="#C90072"/>
    </linearGradient>
    <linearGradient id="walletSide" x1="300" y1="400" x2="500" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FA438C"/>
      <stop offset=".5" stop-color="#D80B79"/>
      <stop offset="1" stop-color="#99075C"/>
    </linearGradient>
    <linearGradient id="flap" x1="240" y1="250" x2="570" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC6E2"/>
      <stop offset=".45" stop-color="#FF8FC6"/>
      <stop offset="1" stop-color="#F52D91"/>
    </linearGradient>
    <linearGradient id="purple" x1="300" y1="130" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7A4FF"/>
      <stop offset=".5" stop-color="#A15BEE"/>
      <stop offset="1" stop-color="#5630C9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF9A9"/>
      <stop offset=".3" stop-color="#FFD94D"/>
      <stop offset=".7" stop-color="#FFAC17"/>
      <stop offset="1" stop-color="#E76C0B"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8BFF9A"/>
      <stop offset=".5" stop-color="#27D889"/>
      <stop offset="1" stop-color="#087C70"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="180" y1="300" x2="630" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8FE0"/>
      <stop offset=".5" stop-color="#A875FF"/>
      <stop offset="1" stop-color="#FFB1C8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="15"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coinShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="7"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="coin">
      <ellipse cy="7" rx="42" ry="40" fill="#E65B16"/>
      <circle r="42" fill="url(#gold)" stroke="#FFF2A0" stroke-width="3"/>
      <circle r="34" fill="#FFC83D" stroke="#F48B0B" stroke-width="3"/>
      <circle r="29" stroke="#FFF1A0" stroke-width="2"/>
      <path d="M-12-15Q-2-24 10-15M-15-7H14M0-19V18M-12 2Q0 13 12 2"
            stroke="#D8790A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-20-20Q-11-32 4-31" stroke="#FFF8C2" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="spark">
      <path d="M0-21Q5-5 21 0Q5 5 0 21Q-5 5-21 0Q-5-5 0-21Z" fill="#FFD94B"/>
    </g>
  </defs>

  <!-- Floating orbit -->
  <g class="orbit">
    <path d="M115 335C55 260 160 208 250 258S470 350 610 245S725 290 640 365S385 465 205 410S115 335 115 335Z"
          stroke="url(#ribbon)" stroke-width="6" opacity=".85"/>
    <path d="M120 335C95 277 160 231 229 260"
          stroke="#FFFFFF" stroke-opacity=".65" stroke-width="2"/>
  </g>

  <!-- Left leaves -->
  <g class="leaf-left">
    <path d="M225 340C133 334 91 267 105 220C173 217 229 275 225 340Z" fill="url(#leaf)"/>
    <path d="M219 333L120 234" stroke="#087E69" stroke-width="4" opacity=".65"/>
    <path d="M233 391C169 418 115 383 109 344C157 321 207 351 233 391Z" fill="url(#leaf)"/>
    <path d="M225 386L123 354" stroke="#087E69" stroke-width="4" opacity=".65"/>
  </g>

  <!-- Right leaves -->
  <g class="leaf-right">
    <path d="M566 416C573 341 633 310 675 332C666 383 618 416 566 416Z" fill="url(#leaf)"/>
    <path d="M573 409L663 341" stroke="#087E69" stroke-width="4" opacity=".65"/>
    <path d="M572 443C623 399 672 416 689 446C655 479 608 474 572 443Z" fill="url(#leaf)"/>
    <path d="M579 444L675 443" stroke="#087E69" stroke-width="4" opacity=".65"/>
  </g>

  <!-- Purple card -->
  <g class="card">
    <path d="M244 214L422 139Q446 129 463 149L510 207Q524 225 503 241L314 316L233 253Q222 230 244 214Z"
          fill="url(#purple)" stroke="#D9BCFF" stroke-width="3"/>
    <path d="M266 224L435 154Q450 150 461 166"
          stroke="#FFFFFF" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
    <rect x="270" y="224" width="65" height="17" rx="8.5"
          fill="#E9D7FF" transform="rotate(-20 270 224)"/>
  </g>

  <!-- Main wallet -->
  <g class="wallet" filter="url(#shadow)">
    <!-- Bottom thickness -->
    <path d="M189 269L511 182Q538 175 550 204L619 421Q628 450 600 466L296 554Q270 561 258 534L168 309Q157 279 189 269Z"
          fill="url(#walletSide)" stroke="#FF8CB9" stroke-width="3"/>

    <!-- Main face -->
    <path d="M181 258L507 170Q536 162 548 191L611 408Q620 436 591 451L288 539Q261 546 250 519L161 298Q150 267 181 258Z"
          fill="url(#wallet)" stroke="#FF9BBE" stroke-width="4"/>

    <!-- Top highlight -->
    <path d="M184 262L507 175Q530 169 541 194"
          stroke="#FFF0F7" stroke-width="4" stroke-linecap="round" opacity=".9"/>

    <!-- Front flap -->
    <path d="M177 331L497 244Q520 238 529 260L554 328Q563 351 539 360L236 450Q211 457 201 433L163 355Q152 338 177 331Z"
          fill="url(#flap)" stroke="#FFD1E6" stroke-width="3"/>

    <path d="M176 338L497 251Q515 246 524 267"
          stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>

    <!-- Sprout logo -->
    <g transform="translate(352 345) rotate(-10)">
      <path d="M0 48V-7" stroke="#FFF3FA" stroke-width="12" stroke-linecap="round"/>
      <path d="M-2 7C-37 6-51-21-41-40C-17-42 1-21-2 7Z"
            fill="#FFF0FA" stroke="#FFE1F0" stroke-width="2"/>
      <path d="M2-8C0-40 22-56 43-49C48-25 28-8 2-8Z"
            fill="#FFF0FA" stroke="#FFE1F0" stroke-width="2"/>
      <path d="M-34-32L-4 1M36-40L4-8"
            stroke="#FFD1E8" stroke-width="2" opacity=".7"/>
    </g>

    <!-- Wallet clasp -->
    <path d="M489 330L571 307Q592 301 599 321L619 376Q625 395 605 402L520 427Q499 433 492 413L473 353Q467 336 489 330Z"
          fill="#C91878" opacity=".5" transform="translate(0 7)"/>
    <path d="M489 322L570 300Q591 294 598 313L617 367Q623 386 603 393L521 418Q500 424 493 404L474 345Q468 328 489 322Z"
          fill="url(#flap)" stroke="#FFB1D3" stroke-width="3"/>
    <path d="M490 328L570 306Q585 302 591 318"
          stroke="#FFF1F8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="544" cy="360" r="25" fill="#C51C77" opacity=".4" transform="translate(2 5)"/>
    <circle cx="544" cy="357" r="23" fill="url(#gold)" stroke="#FFF3AC" stroke-width="3"/>
    <circle cx="544" cy="357" r="16" fill="#FFD64C"/>
    <ellipse cx="537" cy="348" rx="7" ry="4" fill="#FFF9D1" transform="rotate(-25 537 348)"/>
  </g>

  <!-- Floating left coin -->
  <g class="coin-float coin-float-one">
    <g class="coin coin-one" transform="translate(155 143) rotate(-17)" filter="url(#coinShadow)">
      <use href="#coin"/>
    </g>
  </g>

  <!-- Floating right coin -->
  <g class="coin-float coin-float-two">
    <g class="coin coin-two" transform="translate(636 229) rotate(22) scale(.82)" filter="url(#coinShadow)">
      <use href="#coin"/>
    </g>
  </g>

  <!-- Gold coin stack -->
  <g class="stack" filter="url(#coinShadow)">
    <path d="M163 459Q163 442 211 442Q259 442 259 459L258 476Q255 493 211 493Q165 493 163 476Z"
          fill="#E88911" stroke="#FFD968" stroke-width="2"/>
    <ellipse cx="211" cy="459" rx="48" ry="15" fill="url(#gold)" stroke="#FFF0A1" stroke-width="3"/>
    <ellipse cx="211" cy="459" rx="35" ry="9" stroke="#FFF0A1" stroke-width="2"/>

    <path d="M167 427Q167 411 211 411Q255 411 255 427L257 443Q254 458 211 458Q168 458 166 443Z"
          fill="#EE9A16" stroke="#FFDC6C" stroke-width="2"/>
    <ellipse cx="211" cy="427" rx="44" ry="14" fill="url(#gold)" stroke="#FFF1A0" stroke-width="3"/>

    <path d="M178 397Q178 383 211 383Q244 383 244 397L246 411Q243 425 211 425Q179 425 177 411Z"
          fill="#E98A13" stroke="#FFDD71" stroke-width="2"/>
    <ellipse cx="211" cy="397" rx="33" ry="12" fill="url(#gold)" stroke="#FFF0A0" stroke-width="3"/>

    <g transform="translate(258 428) rotate(-17) scale(.75)">
      <use href="#coin"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g class="spark spark-one"><use href="#spark" transform="translate(579 143) scale(1.05)"/></g>
  <g class="spark spark-two"><use href="#spark" transform="translate(105 424) scale(.7)"/></g>
  <g class="spark spark-three"><use href="#spark" transform="translate(661 311) scale(.48)"/></g>
  <style>
    .wallet {
      transform-box: fill-box;
      transform-origin: center;
      animation: wallet-float 4.6s ease-in-out infinite;
    }
    .coin-float {
      transform-box: fill-box;
      transform-origin: center;
    }
    .coin-float-one { animation: coin-float-one 3.3s ease-in-out infinite; }
    .coin-float-two { animation: coin-float-two 3.8s ease-in-out -1s infinite; }
    .stack {
      transform-box: fill-box;
      transform-origin: center;
      animation: stack-bob 4.1s ease-in-out -1.4s infinite;
    }
    .leaf-left,
    .leaf-right {
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    .leaf-left { animation: leaf-sway-left 3.4s ease-in-out infinite; }
    .leaf-right { animation: leaf-sway-right 3.8s ease-in-out -1.1s infinite; }
    .spark {
      transform-box: fill-box;
      transform-origin: center;
      animation: sparkle 1.8s ease-in-out infinite;
    }
    .spark-two { animation-delay: -.6s; }
    .spark-three { animation-delay: -1.2s; }
    .orbit {
      transform-box: fill-box;
      transform-origin: center;
      animation: ribbon-drift 8s ease-in-out infinite alternate;
    }
    .card {
      transform-box: fill-box;
      transform-origin: center;
      animation: card-hover 5s ease-in-out -2s infinite;
    }
    @keyframes wallet-float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-12px) rotate(1.3deg); }
    }
    @keyframes coin-float-one {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-17px) rotate(8deg); }
    }
    @keyframes coin-float-two {
      0%, 100% { transform: translateY(0) rotate(4deg); }
      50% { transform: translateY(-13px) rotate(-9deg); }
    }
    @keyframes stack-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes leaf-sway-left {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes leaf-sway-right {
      0%, 100% { transform: rotate(1deg); }
      50% { transform: rotate(-3deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: .38; transform: scale(.72) rotate(0); }
      50% { opacity: 1; transform: scale(1.16) rotate(18deg); }
    }
    @keyframes ribbon-drift {
      0% { transform: translate(-3px, 2px) rotate(-.5deg); }
      100% { transform: translate(4px, -3px) rotate(.8deg); }
    }
    @keyframes card-hover {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</svg>
